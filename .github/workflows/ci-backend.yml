name: CI Backend

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install poetry
        run: pipx install poetry

      - name: Install dependencies
        working-directory: backend
        run: poetry install --no-root

      - name: Run tests
        working-directory: backend
        run: poetry run pytest -v
