name: CI Backend

on:
  push:
  pull_request:

jobs:
  # Primeiro job: qualidade do código. É rápido e barra o resto se falhar.
  lint:
    name: Lint e formatação
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install Poetry
        run: pipx install poetry==2.5.2

      - name: Install dependencies
        run: poetry install --no-root

      - name: Ruff check
        run: poetry run ruff check .

      - name: Ruff format check
        run: poetry run ruff format --check .

  # Segundo job: só roda se o lint passar.
  test:
    name: Testes
    needs: lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install Poetry
        run: pipx install poetry==2.5.2

      - name: Install dependencies
        run: poetry install --no-root

      - name: Run tests
        run: poetry run pytest -v
