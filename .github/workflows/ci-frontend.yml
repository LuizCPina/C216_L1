name: CI Frontend

on:
  push:
  pull_request:

jobs:
  # Primeiro job: qualidade do código. É rápido e barra o resto se falhar.
  lint:
    name: Lint e formatação
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: "26"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      # biome check = lint + formatação + ordem dos imports, de uma vez.
      - name: Biome check
        run: npm run check

  # Segundo job: só roda se o lint passar.
  test:
    name: Testes
    needs: lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: "26"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      # Os mesmos testes do npm run test, gerando os relatorios em
      # frontend/relatorios. No Actions, o Vitest tambem escreve o resumo
      # dos testes na pagina da execucao.
      - name: Run tests
        run: npm run test:report

      # Mesmo se algum teste falhar, os relatorios sobem: e quando mais servem.
      - name: Upload test reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v5
        with:
          name: relatorio-frontend
          path: frontend/relatorios/
          retention-days: 7
