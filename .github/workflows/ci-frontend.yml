name: CI Frontend

on:
  push:
  pull_request:

jobs:
  # Primeiro job: qualidade de código. Roda sozinho e é rápido.
  lint:
    name: Lint e formatação
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      # biome check = linter + formatação + ordem dos imports, de uma vez.
      - name: Run Biome
        working-directory: frontend
        run: npm run check

  # Segundo job: só começa se o lint passar. Não adianta gastar tempo
  # rodando a suíte e baixando um navegador se o código nem está formatado.
  test:
    name: Testes
    needs: lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Run unit and integration tests
        working-directory: frontend
        run: npm run test

      - name: Install Playwright browser
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Run end-to-end tests
        working-directory: frontend
        run: npm run test:e2e

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 7
