[project]
name = "backend"
version = "0.1.0"
description = ""
authors = [
    {name = "luiz henrique",email = "luizricopina@hotmail.com"}
]
requires-python = ">=3.12"
dependencies = [
    "fastapi (>=0.165.0,<0.166.0)",
    "uvicorn (>=0.54.0,<0.55.0)",
    "sqlalchemy (>=2.1.9,<3.0.0)",
    "psycopg[binary] (>=3.3.9,<4.0.0)",
    "alembic (>=1.20.1,<2.0.0)",
    "pydantic-settings (>=2.16.3,<3.0.0)"
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "ruff (>=0.17.6,<0.18.0)",
    "pytest (>=9.2.0,<10.0.0)",
    "httpx2 (>=2.16.2,<3.0.0)",
    "pytest-html (>=4.2.0,<5.0.0)",
    "pytest-cov (>=7.1.0,<8.0.0)",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.coverage.run]
# A cobertura mede so o codigo da aplicacao, nao os proprios testes.
source = ["app"]
# Caminhos relativos (app/...) no XML, em vez do caminho completo da maquina.
relative_files = true

[tool.coverage.html]
title = "Diário de Ranked — cobertura do backend"
# Em cada linha, um botao mostra os testes que passaram por ela (os testes
# sao gravados pelo --cov-context=test do make test-report e do CI).
show_contexts = true
