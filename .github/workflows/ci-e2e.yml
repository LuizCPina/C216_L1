name: CI E2E

on:
  push:
  pull_request:

jobs:
  # Sobe a aplicacao inteira com o compose, igual ao make up, e usa ela no
  # Chromium com o Playwright. Se algum conteiner nao subir, este job falha.
  e2e:
    name: Playwright com a stack do compose
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      # --wait so termina quando web, api e db estao saudaveis.
      - name: Start the stack
        run: docker compose up -d --build --wait

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: "26"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Install Playwright browser
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Run end-to-end tests
        working-directory: frontend
        run: npm run test:e2e

      - name: Show container logs
        if: failure()
        run: docker compose logs

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v5
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 7

      - name: Stop the stack
        if: always()
        run: docker compose down -v
