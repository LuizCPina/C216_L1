[project]
name = "backend"
version = "0.1.0"
description = ""
authors = [
    {name = "luiz henrique",email = "luizricopina@hotmail.com"}
]
requires-python = ">=3.12"
dependencies = [
    "fastapi (>=0.165.0,<0.166.0)",
    "uvicorn (>=0.54.0,<0.55.0)"
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

